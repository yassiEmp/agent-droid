name: remote mode

on:
  push:
    branches: [main, feat/remote-mode]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs

  link-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Release keystore (from secrets; absent on forks → debug key)
        env:
          KS: ${{ secrets.LINK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/link.p12"
            echo "LINK_KEYSTORE_FILE=$RUNNER_TEMP/link.p12" >> "$GITHUB_ENV"
          fi
      - name: Build agent-droid Link
        working-directory: link
        env:
          LINK_KEYSTORE_PASSWORD: ${{ secrets.LINK_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../agent-droid-link.apk
      - uses: actions/upload-artifact@v4
        with:
          name: agent-droid-link
          path: agent-droid-link.apk
      - name: Publish rolling download (link-latest)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view link-latest >/dev/null 2>&1 || \
            gh release create link-latest --prerelease --title "agent-droid Link (latest build)" \
              --notes "Companion app for agent-droid remote mode. Install on the phone, turn on its accessibility service, then open your relay's setup link. See REMOTE.md."
          gh release upload link-latest agent-droid-link.apk --clobber

  e2e-emulator:
    needs: link-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: agent-droid-link
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator (Android 12, like a Galaxy S10) + full remote run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash test/e2e-emulator.sh agent-droid-link.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshot
          path: e2e-artifacts/
          if-no-files-found: ignore
