plugins {
  id "com.android.application"
}

// Release signing comes from the environment (CI secret) so the key never
// lives in the repo. Without it, release builds fall back to the debug key.
def ksFile = System.getenv("LINK_KEYSTORE_FILE")

android {
  namespace "dev.agentdroid.link"
  compileSdk 35

  defaultConfig {
    applicationId "dev.agentdroid.link"
    minSdk 24
    targetSdk 35
    versionCode 1
    versionName "0.1.0"
  }

  signingConfigs {
    if (ksFile) {
      release {
        storeFile file(ksFile)
        storeType "pkcs12"
        storePassword System.getenv("LINK_KEYSTORE_PASSWORD")
        keyAlias System.getenv("LINK_KEY_ALIAS") ?: "agent-droid-link"
        keyPassword System.getenv("LINK_KEYSTORE_PASSWORD")
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
    }
  }

  lint {
    abortOnError false
    checkReleaseBuilds false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
